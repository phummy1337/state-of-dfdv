name: refresh data

on:
  schedule:
    # Twice on weekdays, shortly after the US close and again pre-open (UTC).
    - cron: "30 21 * * 1-5"
    - cron: "30 11 * * 1-5"
    # Once at the weekend so SOL price and treasury moves don't go stale.
    - cron: "30 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet certifi

      - name: Fetch sources and rebuild data.json
        run: python3 refresh_data.py

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
