<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State of DFDV</title>
<meta name="description" content="Performance, treasury, leverage and market-structure dashboard for DeFi Development Corp (Nasdaq: DFDV).">
<meta property="og:title" content="State of DFDV">
<meta property="og:description" content="How DFDV is performing against SOL, a SOL ETF, a SOL perp, and its own leverage-implied expected range.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap">
<style>
/* ---------------------------------------------------------------------------
   State of DFDV.

   Palette, type and component metrics are adopted from stateofsol.com so the two
   dashboards read as one family: deep navy ground, translucent navy panels,
   periwinkle hairlines and secondary text, Syne for the wordmark, section heads
   and labels, orange reserved for UI accent.

   The categorical series slots are the validated order
   [#d07705, #199e70, #5b8def, #d55181] against the panel surface (#0a152b):
   all inside the dark lightness band, worst adjacent CVD dE 9.3, worst adjacent
   normal-vision dE 21.9, every slot over 3:1 on the surface. Do not re-order or
   substitute without re-running the palette validator. --orange is UI chrome and
   --mint / --neg are status; none of the three is ever a series color.

   Committed single theme: this mirrors a dark-only house style, so there is no
   light variant. Every color is painted explicitly from a token.
--------------------------------------------------------------------------- */
:root{
  color-scheme: dark;
  --bg:#030815;
  --bg-glow:#0a1730;
  --panel:rgba(13,26,52,.7);
  --panel-2:rgba(13,26,52,.55);
  --panel-solid:#0a152b;
  --line:rgba(143,165,212,.16);
  --line-2:rgba(143,165,212,.08);
  --line-3:rgba(143,165,212,.22);

  --ink:#F1F5FB;
  --ink-2:#8FA5D4;
  --ink-3:#6B7FAB;

  --orange:#F97316;
  --orange-dim:#c25a0f;
  --mint:#14F195;
  --neg:#FF6B6B;

  --s-dfdv:#d07705; --s-etf:#199e70; --s-sol:#5b8def; --s-perp:#d55181;
  --band:rgba(208,119,5,.14);
  --band-edge:rgba(208,119,5,.42);

  --syne:"Syne",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --gut:48px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html,body{overflow-x:clip}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(80% 50% at 20% 0%, rgba(40,70,140,.30) 0%, transparent 55%),
    linear-gradient(#0a1633 0%, #060e26 60%, #030815 100%);
  background-attachment:fixed, fixed;
  background-repeat:no-repeat, no-repeat;
  background-size:100% 100%, 100% 100%;
  color:var(--ink); font-family:var(--syne); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
.wrap{padding:0 var(--gut) 80px}
a{color:var(--orange);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}

/* marquee ----------------------------------------------------------------- */
.marquee{flex:0 0 auto;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--line-2)}
.marquee-track{display:inline-flex;white-space:nowrap;will-change:transform;padding:9px 0;
  animation:marq var(--dur,70s) linear infinite}
.marquee:hover .marquee-track,.marquee:focus-within .marquee-track{animation-play-state:paused}
@keyframes marq{100%{transform:translateX(-50%)}}
.mq-item{display:inline-flex;align-items:baseline;gap:9px;padding:0 0 0 30px;font-size:13px;font-weight:600}
.mq-item::after{content:"•";margin-left:30px;color:rgba(143,165,212,.3)}
.mq-src{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mq-item a{color:var(--ink-2);text-decoration:none}
.mq-item a:hover{color:var(--ink)}
.mq-date{font-size:10.5px;font-weight:700;color:var(--ink-3);font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){
  .marquee{overflow-x:auto}
  .marquee-track{animation:none}
}

/* header ------------------------------------------------------------------ */
.top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:space-between;padding:34px 0 0}
h1{margin:0;font-family:var(--syne);font-size:clamp(28px,3.4vw,50px);font-weight:700;
  letter-spacing:-.01em;line-height:1.05;display:flex;align-items:center;gap:.38em}
.mark{height:.78em;width:auto;flex:0 0 auto}
.tagline{font-family:var(--syne);font-size:clamp(14px,1.3vw,19px);font-weight:600;
  color:var(--ink-2);margin-top:8px}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:0 0 auto}
.dfdv{display:flex;align-items:center;gap:10px;text-decoration:none}
.dfdv:hover{text-decoration:none}
.dfdv:hover .dfdv-name{color:var(--orange)}
.builtby{font-family:var(--syne);font-size:8.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.dfdv-mark{height:17px;width:auto;flex:0 0 auto}
.dfdv-name{font-family:var(--syne);font-size:12.5px;font-weight:700;color:var(--ink);
  letter-spacing:-.01em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:6px 13px;
  font-family:var(--syne);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none;
  animation:pulse 2.4s ease infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(20,241,149,.55)}
  70%{box-shadow:0 0 0 8px rgba(20,241,149,0)}
  100%{box-shadow:0 0 0 0 rgba(20,241,149,0)}
}

/* hero strip -------------------------------------------------------------- */
.herorow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hcard .k{font-family:var(--syne);font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.hcard .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.hcard .s{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:5px}
.hcard.accent{border-color:rgba(249,115,22,.32);
  background:linear-gradient(180deg,rgba(249,115,22,.09),var(--panel))}

/* sections ---------------------------------------------------------------- */
section{margin:46px 0 0}
.shead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shead h2{margin:0;font-family:var(--syne);font-size:17px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.shead .rule{flex:1 1 0;height:1px;background:var(--line-2)}
.shead .asof{font-family:var(--syne);font-size:12px;font-weight:600;color:var(--ink-3);
  font-style:italic;white-space:nowrap}
.note{color:var(--ink-2);font-size:13px;margin:14px 0 16px;max-width:82ch}

/* tiles ------------------------------------------------------------------- */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(186px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;min-width:0}
.tile .k{font-family:var(--syne);font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.15}
.tile .s{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:4px;
  font-variant-numeric:tabular-nums}
.up{color:var(--mint)} .dn{color:var(--neg)}

/* panels / charts --------------------------------------------------------- */
.panel{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:17px 19px 13px}
.panel-hd{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.panel-hd h3{margin:0;font-family:var(--syne);font-size:14px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.panel-hd .sub{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-top:5px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grp{display:flex;background:var(--panel);border:1px solid var(--line-3);border-radius:20px;overflow:hidden}
button.seg{background:none;border:0;color:var(--ink-2);font-family:var(--syne);font-size:12px;
  font-weight:700;padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
button.seg+button.seg{border-left:1px solid var(--line-2)}
button.seg:hover{color:var(--ink)}
button.seg[aria-pressed=true]{background:var(--orange);color:#170a01}
.datectl{display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line-3);border-radius:20px;padding:0 12px 0 13px}
.datectl span{font-family:var(--syne);font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.dateinp{background:none;border:0;color:var(--ink);font-family:var(--mono);font-size:11.5px;
  padding:6px 0;cursor:pointer;min-width:104px}
.dateinp::-webkit-calendar-picker-indicator{filter:invert(.62) sepia(.2);cursor:pointer}
.dateinp:hover{color:var(--orange)}
.legend{display:flex;gap:17px;flex-wrap:wrap;margin:14px 0 2px;font-size:12.5px;
  font-weight:600;color:var(--ink-2)}
.legend .it{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border-radius:4px}
.legend .it[aria-pressed=false]{opacity:.34}
.legend svg{flex:none}
.plot{position:relative;width:100%}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--line-2);stroke-width:1;shape-rendering:crispEdges}
.axis-t{fill:var(--ink-3);font-size:11px;font-family:var(--mono)}
.dlrow{display:flex;justify-content:flex-end;margin-top:6px}
button.dlbtn{background:var(--panel);border:1px solid var(--line-3);border-radius:9px;
  color:var(--ink-2);font-family:var(--syne);font-size:10.5px;font-weight:700;
  padding:4px 10px;cursor:pointer}
button.dlbtn:hover{color:var(--orange);border-color:rgba(249,115,22,.4)}
button.dlbtn[disabled]{opacity:.5;cursor:default}
.tip{position:absolute;pointer-events:none;background:#050d1e;border:1px solid var(--line-3);
  border-radius:10px;padding:10px 12px;font-size:12px;min-width:190px;opacity:0;
  transition:opacity .1s;box-shadow:0 10px 30px rgba(0,0,0,.65);z-index:5}
.tip .d{color:var(--ink-3);font-size:11px;margin-bottom:7px;font-family:var(--mono)}
.tip .r{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:4px}
.tip .r .nm{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.tip .r .vv{font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--ink)}
.sw{width:12px;height:3px;border-radius:2px;flex:none}

/* band readout ------------------------------------------------------------ */
.gauge{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
.gauge .bar{position:relative;height:9px;border-radius:5px;
  background:linear-gradient(90deg,rgba(13,26,52,.9),var(--band),rgba(13,26,52,.9));
  border:1px solid var(--line-3)}
.gauge .mk{position:absolute;top:-5px;width:3px;height:17px;background:var(--orange);border-radius:2px}
.gauge .ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;
  font-weight:600;color:var(--ink-3);margin-top:9px;flex-wrap:wrap}

/* tables ------------------------------------------------------------------ */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel-2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
th{font-family:var(--syne);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
   color:var(--ink-3);font-weight:700;position:sticky;top:0;z-index:2;
   background:#0c1932;box-shadow:inset 0 -1px 0 var(--line)}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(143,165,212,.05)}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* filings ----------------------------------------------------------------- */
.filings{max-height:440px;overflow-y:auto;border-top:1px solid var(--line-2);
  scrollbar-width:thin;scrollbar-color:var(--line-3) transparent}
.filings::-webkit-scrollbar{width:9px}
.filings::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:5px}
a.filing{display:grid;grid-template-columns:112px 74px 1fr 18px;align-items:center;gap:12px;
  padding:10px 4px;border-bottom:1px solid var(--line-2);color:var(--ink);
  text-decoration:none;font-size:13px}
a.filing:last-child{border-bottom:0}
a.filing:hover{background:rgba(143,165,212,.06);text-decoration:none}
a.filing:hover .fgo{color:var(--orange)}
.fdate{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fform{font-family:var(--syne);font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-align:center;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-3);
  border-radius:7px;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flabel{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fgo{color:var(--ink-3);font-size:12px;text-align:right}
.fempty{padding:22px 4px;color:var(--ink-3);font-size:13px}
@media (max-width:640px){
  a.filing{grid-template-columns:96px 62px 1fr;gap:9px;font-size:12.5px}
  .fgo{display:none}
}

details.meth{border:1px solid var(--line);border-radius:14px;background:var(--panel-2)}
details.meth>summary{padding:15px 19px;cursor:pointer;font-family:var(--syne);font-size:13px;
  font-weight:700;list-style:none}
details.meth>summary::-webkit-details-marker{display:none}
details.meth>summary::before{content:"▸ ";color:var(--orange)}
details.meth[open]>summary::before{content:"▾ "}
.meth-body{padding:0 19px 19px;font-size:13px;color:var(--ink-2);max-width:90ch}
.meth-body h4{color:var(--ink);font-family:var(--syne);font-size:12px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;margin:18px 0 6px}
.meth-body p{margin:7px 0}
.meth-body code{font-family:var(--mono);font-size:12px;background:rgba(143,165,212,.1);
  padding:1px 5px;border-radius:4px;color:var(--ink)}
.meth-body ul{margin:7px 0;padding-left:19px}
.meth-body li{margin:4px 0}
.meth-body b{color:var(--ink)}

footer{border-top:1px solid var(--line);margin-top:46px;padding-top:22px;
  font-size:11.5px;color:var(--ink-3);line-height:1.7;max-width:100ch}
.err{border:1px solid var(--neg);border-radius:14px;padding:18px;color:var(--ink-2);font-size:13px}

@media (max-width:1100px){ :root{--gut:26px} }
@media (max-width:760px){
  :root{--gut:14px}
  .wrap{padding-bottom:60px}
  .hcard .v{font-size:25px}
  .trio{grid-template-columns:1fr}
}
.split{display:grid;grid-template-columns:minmax(310px,3.5fr) 8.5fr;gap:0 28px}
.split-left,.split-right{min-width:0}
.split-right{display:flex;flex-direction:column}
.split .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.split .tile{padding:11px 13px}
.split .tile .k{font-size:11.5px}
.split .tile .v{font-size:22px}
.split .shead{flex-wrap:wrap;row-gap:4px}
.split .shead .asof{white-space:normal}
@media (max-width:1180px){ .split{grid-template-columns:1fr;gap:26px} }
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1080px){ .trio{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="marquee" id="marquee" aria-label="Latest from the DFDV newsletter" hidden>
  <div class="marquee-track" id="marqueeTrack"></div>
</div>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1><svg class="mark" viewBox="0 0 548 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="dfdvMark" x1="121.6" y1="320.9" x2="426.11" y2="16.4" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f18f34"/><stop offset="1" stop-color="#ff4431"/></linearGradient></defs><path fill="url(#dfdvMark)" d="M410.25,110.94V.54H137.47v110.4C86.5,129.98,39.74,159.82,0,199.3h44.22c28.31-23.66,59.71-42.58,93.25-56.35v56.21h29.82v-66.91c34.06-10.55,69.89-16.01,106.57-16.01s72.51,5.47,106.57,16.02v66.9h29.82v-56.19c33.52,13.77,64.93,32.67,93.23,56.33h44.22c-39.74-39.48-86.49-69.32-137.45-88.36ZM380.43,101.14c-34.22-9.71-70.01-14.71-106.57-14.71s-72.35,5-106.57,14.71V30.34h213.14v70.8Z"/></svg>State of DFDV</h1>
        <div class="tagline" id="tagline">Loading…</div>
      </div>
      <div class="topright">
        <a class="dfdv" href="https://defidevcorp.com" target="_blank" rel="noopener noreferrer">
          <span class="builtby">Built by</span>
          <svg class="dfdv-mark" viewBox="0 0 548 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs><linearGradient id="dfdvMark2" x1="121.6" y1="320.9" x2="426.11" y2="16.4" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#f18f34"/><stop offset="1" stop-color="#ff4431"/></linearGradient></defs>
            <path fill="url(#dfdvMark2)" d="M410.25,110.94V.54H137.47v110.4C86.5,129.98,39.74,159.82,0,199.3h44.22c28.31-23.66,59.71-42.58,93.25-56.35v56.21h29.82v-66.91c34.06-10.55,69.89-16.01,106.57-16.01s72.51,5.47,106.57,16.02v66.9h29.82v-56.19c33.52,13.77,64.93,32.67,93.23,56.33h44.22c-39.74-39.48-86.49-69.32-137.45-88.36ZM380.43,101.14c-34.22-9.71-70.01-14.71-106.57-14.71s-72.35,5-106.57,14.71V30.34h213.14v70.8Z"/>
          </svg>
          <span class="dfdv-name">DeFi Development Corp.</span>
        </a>
        <div class="pill" id="pill"><span class="dot"></span><span id="pilltxt">Loading</span></div>
      </div>
    </div>
    <div class="herorow" id="hero"></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script>
/* =========================================================================
   State of DFDV - rendering layer.
   Reads data.json (built by refresh_data.py). No external dependencies:
   the charts are hand-rolled SVG so the page stays self-contained.
   ========================================================================= */

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const k of [].concat(kids)) if (k) n.append(k);
  return n;
};
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) n.setAttribute(k, v);
  return n;
};

/* --- formatting ---------------------------------------------------------- */
const nf = (v, d = 2) => v === null || v === undefined || !isFinite(v) ? '—'
  : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v === null || v === undefined || !isFinite(v) ? '—' : `${v >= 0 ? '+' : ''}${nf(v, d)}%`;
const usd = (v, d = 2) => v === null || v === undefined ? '—' : `$${nf(v, d)}`;
const compact = (v, pre = '') => {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return `${pre}${nf(v / 1e9, 2)}B`;
  if (a >= 1e6) return `${pre}${nf(v / 1e6, 1)}M`;
  if (a >= 1e3) return `${pre}${nf(v / 1e3, 1)}K`;
  return `${pre}${nf(v, 0)}`;
};
const int = v => v === null || v === undefined ? '—' : Math.round(v).toLocaleString('en-US');
const cls = v => v === null || v === undefined ? '' : (v >= 0 ? 'up' : 'dn');
const dateLabel = iso => {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T12:00:00Z' : ''));
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
};

function tile(k, v, sub, klass) {
  return el('div', { class: 'tile' }, [
    el('div', { class: 'k', title: k }, k),
    el('div', { class: 'v ' + (klass || '') }, v),
    sub ? el('div', { class: 's' }, sub) : null,
  ]);
}
const tileGrid = items => el('div', { class: 'tiles' }, items);
const sectionHead = (title, asof) => el('div', { class: 'shead' }, [
  el('h2', {}, title),
  el('span', { class: 'rule' }),
  asof ? el('span', { class: 'asof' }, asof) : null,
]);

/* =========================================================================
   PNG export.

   A downloaded chart travels alone, so the export is not a screenshot of the
   plot - it rebuilds the figure with its own title, legend, source line and
   ground. CSS classes and custom properties do not survive serialisation, so
   every paint is copied off getComputedStyle onto the clone first.
   ========================================================================= */
const PAINT = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap',
  'stroke-linejoin', 'opacity', 'font-size', 'font-family', 'font-weight', 'text-anchor'];

// Resolved once, lazily: the artifact viewer's download broker, or null anywhere else
// (a plain web server, a local file) where an anchor download is the right path.
let _downloads;
function hostDownloads() {
  if (_downloads === undefined) {
    _downloads = (window.claude && typeof window.claude.use === 'function')
      ? window.claude.use('downloads').catch(() => null)
      : Promise.resolve(null);
  }
  return _downloads;
}

function inlinePaint(src, dst) {
  const cs = getComputedStyle(src);
  let css = '';
  for (const p of PAINT) {
    const v = cs.getPropertyValue(p);
    if (v && v !== 'none' || p === 'fill' || p === 'stroke') css += `${p}:${v};`;
  }
  dst.setAttribute('style', css);
  const s = src.children, d = dst.children;
  for (let i = 0; i < s.length; i++) inlinePaint(s[i], d[i]);
}

function exportPNG(chart, meta) {
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // Re-render the chart at a fixed export width so the figure's proportions never
  // depend on the browser window it happened to be drawn in, and so the axis picks a
  // tick density suited to the output rather than to the on-screen panel.
  const OUT_W = 1600;
  const PAD = 56;
  const plotW = OUT_W - PAD * 2;
  const host = chart.host;
  const prevW = host.style.width;
  host.style.width = plotW + 'px';
  chart.exportMode = true;
  chart.draw();
  const live = host.querySelector('svg');
  const plotH = live.viewBox.baseVal.height;
  const clone = live.cloneNode(true);
  inlinePaint(live, clone);
  clone.setAttribute('width', plotW);
  clone.setAttribute('height', plotH);
  chart.exportMode = false;
  host.style.width = prevW;
  chart.draw();

  // Lay the legend out first - it can wrap to more than one row, and the canvas
  // height depends on how many. Text is measured rather than estimated; guessing
  // from character counts ran the last series off the right edge.
  const LEG_SIZE = 21, LEG_GAP = 40, SW_W = 30, SW_PAD = 42, ROW_H = 34;
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = `600 ${LEG_SIZE}px "Syne", Helvetica, Arial, sans-serif`;
  const legItems = (meta.legend || []).map(it => {
    const label = it.value ? `${it.label} (${it.value})` : it.label;
    return { ...it, label, w: SW_PAD + meas.measureText(label).width };
  });
  const rows = [[]];
  let rowW = 0;
  for (const it of legItems) {
    if (rowW && rowW + it.w > plotW) { rows.push([]); rowW = 0; }
    rows[rows.length - 1].push(it);
    rowW += it.w + LEG_GAP;
  }

  const HEAD = 168, FOOT = 96;
  const LEGEND = 40 + (rows.length - 1) * ROW_H + 22;
  const outH = HEAD + plotH + LEGEND + FOOT;
  const SCALE = 2;
  const out = svgEl('svg', {
    xmlns: NS, width: OUT_W * SCALE, height: outH * SCALE, viewBox: `0 0 ${OUT_W} ${outH}`,
  });
  const SANS = '"Syne",Helvetica,Arial,sans-serif';
  const MONO = 'ui-monospace,Menlo,Consolas,monospace';
  const ink = cssVar('--ink'), ink2 = cssVar('--ink-2'), ink3 = cssVar('--ink-3'), orange = cssVar('--orange');

  // Ground: the page's own gradient, flattened into the figure.
  const defs = svgEl('defs');
  const bg = svgEl('linearGradient', { id: 'exbg', x1: '0', y1: '0', x2: '0', y2: '1' });
  for (const [o, c] of [[0, '#0a1633'], [0.6, '#060e26'], [1, '#030815']]) {
    bg.append(svgEl('stop', { offset: o, 'stop-color': c }));
  }
  const mg = svgEl('linearGradient', {
    id: 'exmark', x1: '121.6', y1: '320.9', x2: '426.11', y2: '16.4', gradientUnits: 'userSpaceOnUse',
  });
  mg.append(svgEl('stop', { offset: '0', 'stop-color': '#f18f34' }), svgEl('stop', { offset: '1', 'stop-color': '#ff4431' }));
  defs.append(bg, mg);
  out.append(defs, svgEl('rect', { x: 0, y: 0, width: OUT_W, height: outH, fill: 'url(#exbg)' }));

  const text = (x, y, str, o = {}) => {
    const t = svgEl('text', {
      x, y, fill: o.fill || ink, 'font-size': o.size || 16, 'font-family': o.font || SANS,
      'font-weight': o.weight || 700, 'text-anchor': o.anchor || 'start', 'letter-spacing': o.ls || null,
    });
    t.textContent = str;
    return t;
  };

  out.append(text(PAD, 74, meta.title, { size: 40 }));
  if (meta.subtitle) out.append(text(PAD, 112, meta.subtitle, { size: 19, weight: 600, fill: ink2 }));

  // Brand lockup, top right: the mark then the company name.
  const NAME = 'DeFi Development Corp.';
  const nameSize = 27;
  const nameW = NAME.length * nameSize * 0.545;
  const markH = 30, markW = markH * (548 / 200);
  const g = svgEl('g', { transform: `translate(${OUT_W - PAD - nameW - markW - 18}, 44)` });
  const ms = svgEl('svg', { width: markW, height: markH, viewBox: '0 0 548 200' });
  ms.append(svgEl('path', { fill: 'url(#exmark)', d: 'M410.25,110.94V.54H137.47v110.4C86.5,129.98,39.74,159.82,0,199.3h44.22c28.31-23.66,59.71-42.58,93.25-56.35v56.21h29.82v-66.91c34.06-10.55,69.89-16.01,106.57-16.01s72.51,5.47,106.57,16.02v66.9h29.82v-56.19c33.52,13.77,64.93,32.67,93.23,56.33h44.22c-39.74-39.48-86.49-69.32-137.45-88.36ZM380.43,101.14c-34.22-9.71-70.01-14.71-106.57-14.71s-72.35,5-106.57,14.71V30.34h213.14v70.8Z' }));
  g.append(ms);
  g.append(text(markW + 18, markH - 7, NAME, { size: nameSize }));
  out.append(g);

  // Plot
  const gp = svgEl('g', { transform: `translate(${PAD},${HEAD})` });
  gp.append(clone);
  out.append(gp);

  // Legend under the plot, values included - a downloaded chart travels alone.
  rows.forEach((row, ri) => {
    let lx = PAD;
    const ly = HEAD + plotH + 40 + ri * ROW_H;
    for (const it of row) {
      out.append(svgEl('line', {
        x1: lx, x2: lx + SW_W, y1: ly - 7, y2: ly - 7, stroke: it.color,
        'stroke-width': Math.max(5, (it.width || 2) * 2.2), 'stroke-linecap': 'round',
        'stroke-dasharray': it.dash ? it.dash.split(' ').map(n => n * 2.2).join(' ') : null,
      }));
      out.append(text(lx + SW_PAD, ly, it.label, { size: LEG_SIZE, weight: 600, fill: ink }));
      lx += it.w + LEG_GAP;
    }
  });

  // Footer
  out.append(svgEl('line', {
    x1: PAD, x2: OUT_W - PAD, y1: outH - 60, y2: outH - 60,
    stroke: 'rgba(143,165,212,.14)', 'stroke-width': 1,
  }));
  out.append(text(PAD, outH - 28, meta.footer, { size: 14, weight: 600, font: MONO, fill: ink3 }));

  const str = new XMLSerializer().serializeToString(out);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = OUT_W * SCALE; c.height = outH * SCALE;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    // 1:1 - the SVG already carries the full output resolution, so this rasterises
    // the vector at device pixels instead of resampling a smaller bitmap.
    ctx.drawImage(img, 0, 0, OUT_W * SCALE, outH * SCALE);
    c.toBlob(async b2 => {
      if (!b2) return;
      const dl = await hostDownloads();
      if (dl) {
        try {
          await dl.save({ filename: meta.filename, data: b2 });
        } catch (err) {
          if (err && err.code && err.code !== 'declined' && err.code !== 'rate_limited') {
            alert('Could not save the PNG: ' + (err.message || err.code));
          }
        }
        return;
      }
      const a2 = document.createElement('a');
      a2.href = URL.createObjectURL(b2);
      a2.download = meta.filename;
      document.body.append(a2);
      a2.click();
      a2.remove();
      setTimeout(() => URL.revokeObjectURL(a2.href), 2000);
    }, 'image/png');
  };
  img.onerror = () => alert('Could not render the chart to PNG in this browser.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

/* =========================================================================
   Line chart
   ========================================================================= */
function lineChart(opts) {
  const host = el('div', { class: 'plot' });
  const tip = el('div', { class: 'tip' });
  host.append(tip);

  const state = { range: opts.defaultRange || 'max', log: !!opts.log, off: new Set(), from: null };
  const api = { host, state, draw, lastDrawn: [], exportMode: false };
  api.endValue = s => {
    const pts = (api.lastDrawn.find(x => x.key === s.key) || {}).pts || [];
    const v = [...pts].reverse().find(x => x !== null && x !== undefined);
    if (v === undefined) return null;
    // A second-axis series is in its own units, so it needs its own formatter.
    if (s.axis === 'y2') return opts.fmtTip2 ? opts.fmtTip2(v) : nf(v, 2);
    return opts.fmtEnd ? opts.fmtEnd(v) : pct(v - 100, 1);
  };

  function slice() {
    const d = opts.dates, n = d.length;
    if (state.range === 'max') return 0;
    let cut;
    if (state.range === 'custom') cut = state.from;
    else if (state.range === 'ytd') {
      cut = `${new Date(d[n - 1] + 'T12:00:00Z').getUTCFullYear()}-01-01`;
    } else {
      const c = new Date(d[n - 1] + 'T12:00:00Z');
      c.setUTCDate(c.getUTCDate() - { '1m': 30, '3m': 91, '6m': 182, '1y': 365 }[state.range]);
      cut = c.toISOString().slice(0, 10);
    }
    if (!cut) return 0;
    // Base the window on the last trading day at or BEFORE the anchor, the same
    // convention the return tiles and the comparison table use - otherwise a YTD
    // chart would start from Jan 2 and disagree with the YTD tile.
    const i = d.findIndex(x => x > cut);
    const from = i < 0 ? n - 1 : Math.max(0, i - 1);
    return Math.min(from, Math.max(0, n - 2)); // always leave two points to draw
  }

  function draw() {
    const from = slice();
    const dates = opts.dates.slice(from);
    const N = dates.length;
    // Match the viewBox to the rendered pixel width so 1 unit == 1 px. A fixed
    // viewBox would shrink all the type in the narrow small-multiple panels.
    const EX = !!api.exportMode;   // rendering for a PNG: bigger type, thicker marks
    const W = Math.max(320, Math.round(host.clientWidth || 1000));
    const H = opts.aspect
      ? Math.max(opts.minHeight || 320, Math.round(W / opts.aspect))
      : (opts.height || 400);
    const M = EX ? { t: 18, r: opts.fmtAxis2 ? 104 : 100, b: 52, l: 96 }
                 : { t: 14, r: opts.fmtAxis2 ? 66 : 62, b: 26, l: 54 };
    const pw = W - M.l - M.r, ph = H - M.t - M.b;

    const active = opts.series.filter(s => !state.off.has(s.key));
    const ok = v => v !== null && v !== undefined && isFinite(v);
    // Divisor for a series over this window: its own value on the first visible day.
    // A series that does not exist yet on that day (BSOL before its listing) has no
    // return over the window, so it borrows the divisor of the series it was spliced
    // onto - otherwise rebasing it to its own first print would erase the splice.
    const divisorOf = s => {
      const raw = s.values.slice(from);
      if (ok(raw[0]) && raw[0] > 0) return raw[0];
      if (s.rebaseWith) {
        const ref = opts.series.find(x => x.key === s.rebaseWith);
        if (ref) {
          const r = ref.values.slice(from);
          if (ok(r[0]) && r[0] > 0) return r[0];
        }
      }
      return 100; // data.json series are already indexed to 100 at the common start
    };
    const reb = s => {
      const raw = s.values.slice(from);
      if (opts.rebase === false) return raw.map(v => ok(v) ? v : null);
      const base = divisorOf(s);
      return raw.map(v => ok(v) ? v / base * 100 : null);
    };
    const drawn = active.map(s => ({ ...s, pts: reb(s) }));
    api.lastDrawn = drawn;
    api.lastDates = dates;
    const bands = (opts.bands || []).map(b => ({
      ...b, lo: reb({ values: b.loValues }), hi: reb({ values: b.hiValues }),
    }));

    // Series may opt on to a second, right-hand scale. Two scales on one plot invent
    // a relationship the data does not have, so this is reserved for a context line
    // (DFDV's price behind a metric), never for two series meant to be compared.
    const a1 = drawn.filter(x => x.axis !== 'y2');
    const a2 = drawn.filter(x => x.axis === 'y2');
    let vals = [];
    for (const x of a1) vals = vals.concat(x.pts.filter(v => v !== null));
    for (const b of bands) vals = vals.concat(b.lo.filter(v => v !== null), b.hi.filter(v => v !== null));
    if (!vals.length) return;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (state.log) lo = Math.max(lo, 0.01);
    const padF = state.log ? 1.09 : 0.06;
    if (state.log) { lo /= padF; hi *= padF; }
    else {
      const p = (hi - lo) * padF || 1;
      lo = (vals.every(v => v >= 0) && lo - p < 0) ? 0 : lo - p;
      hi += p;
    }

    let lo2 = 0, hi2 = 1;
    if (a2.length) {
      const v2 = a2.flatMap(x => x.pts.filter(v => v !== null));
      lo2 = Math.min(...v2); hi2 = Math.max(...v2);
      const p2 = (hi2 - lo2) * 0.08 || 1;
      lo2 = Math.max(0, lo2 - p2); hi2 += p2;
    }
    const Y2 = v => M.t + ph - (v - lo2) / (hi2 - lo2 || 1) * ph;
    const scaleFor = x => (x.axis === 'y2' ? Y2 : Y);
    const X = i => M.l + (N === 1 ? pw / 2 : i / (N - 1) * pw);
    const Y = v => {
      if (state.log) {
        const l = Math.log(Math.max(v, 1e-6)), a = Math.log(lo), b = Math.log(hi);
        return M.t + ph - (l - a) / (b - a) * ph;
      }
      return M.t + ph - (v - lo) / (hi - lo) * ph;
    };

    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'chart' });

    // Scale the tick count to the plot height - a 240px panel cannot carry the same
    // number of gridlines as a 420px one without the labels colliding.
    const want = Math.max(3, Math.min(6, Math.round(ph / 55)));
    const ticks = [];
    let tickStep = null;
    const decades = Math.log10(hi / lo);
    if (state.log && decades >= 1.2) {
      // Enough range for decade ticks. Thin the mantissas as the span grows so a
      // multi-decade axis doesn't stack labels on top of each other.
      const mants = decades > 6 ? [1] : decades > 3 ? [1, 3] : [1, 2, 5];
      for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
        for (const m of mants) {
          const v = m * Math.pow(10, e);
          if (v >= lo && v <= hi) ticks.push(v);
        }
    } else {
      // Either a linear axis, or a log axis showing less than about a decade - where
      // 1/2/5-per-decade would yield one or two ticks for the whole window. Over a
      // span this short the log scale is near enough linear that evenly spaced nice
      // steps read correctly and label the axis properly.
      tickStep = niceStep((hi - lo) / want);
      for (let v = Math.ceil(lo / tickStep) * tickStep; v <= hi; v += tickStep) ticks.push(v);
    }
    if (a2.length) {
      const want2 = Math.max(3, Math.min(5, Math.round(ph / 62)));
      const step2 = niceStep((hi2 - lo2) / want2);
      const col = a2[0].color;
      for (let v = Math.ceil(lo2 / step2) * step2; v <= hi2; v += step2) {
        const t2 = svgEl('text', {
          x: M.l + pw + (EX ? 14 : 9), y: Y2(v) + (EX ? 6 : 4), 'text-anchor': 'start',
          class: 'axis-t', fill: col, 'font-size': EX ? 20 : 11, 'font-weight': EX ? 600 : null,
        });
        t2.textContent = opts.fmtAxis2 ? opts.fmtAxis2(v, step2) : nf(v, 0);
        svg.append(t2);
      }
    }
    let lastTickY = Infinity;
    for (const t of ticks) {
      const y = Y(t);
      if (lastTickY - y < 22) continue; // keep labels from colliding on log axes
      lastTickY = y;
      svg.append(svgEl('line', {
        class: 'gridline', x1: M.l, x2: M.l + pw, y1: y, y2: y,
        'stroke-width': EX ? 1.6 : 1, opacity: EX ? 1.5 : 1,
      }));
      const tx = svgEl('text', { class: 'axis-t', x: M.l - (EX ? 16 : 9), y: y + (EX ? 7 : 4),
        'text-anchor': 'end', 'font-size': EX ? 20 : 11, 'font-weight': EX ? 600 : null });
      tx.textContent = opts.fmtAxis ? opts.fmtAxis(t, tickStep) : nf(t, 0);
      svg.append(tx);
    }
    if (opts.baseline !== undefined && opts.baseline >= lo && opts.baseline <= hi) {
      svg.append(svgEl('line', {
        x1: M.l, x2: M.l + pw, y1: Y(opts.baseline), y2: Y(opts.baseline),
        stroke: 'var(--line-3)', 'stroke-width': 1.5, 'shape-rendering': 'crispEdges',
      }));
    }
    // Evenly spaced date ticks across the visible window. Month-starts-only left a
    // one-month window with two labels, which reads as a broken axis.
    const want_x = Math.max(3, Math.min(9, Math.round(pw / (EX ? 150 : 118))));
    const spanDays = (new Date(dates[N - 1]) - new Date(dates[0])) / 86400000;
    const longSpan = spanDays > 400;
    const stepI = Math.max(1, Math.floor((N - 1) / (want_x - 1)));
    const tickIdx = [];
    for (let i = 0; i < N; i += stepI) tickIdx.push(i);
    if (tickIdx[tickIdx.length - 1] !== N - 1 && N > 1) {
      // keep the last tick, but not crowded against the one before it
      if (X(N - 1) - X(tickIdx[tickIdx.length - 1]) < 46) tickIdx.pop();
      tickIdx.push(N - 1);
    }
    for (const i of tickIdx) {
      const x = X(i);
      svg.append(svgEl('line', {
        class: 'gridline', x1: x, x2: x, y1: M.t, y2: M.t + ph,
        'stroke-width': EX ? 1.6 : 1, opacity: EX ? 1.5 : 1,
      }));
      const tx = svgEl('text', {
        class: 'axis-t', x, y: H - (EX ? 14 : 8), 'text-anchor': 'middle',
        'font-size': EX ? 20 : 11, 'font-weight': EX ? 600 : null,
      });
      const dd = new Date(dates[i] + 'T12:00:00Z');
      tx.textContent = longSpan
        ? dd.toLocaleDateString('en-US', { month: 'short', year: '2-digit', timeZone: 'UTC' }).replace(' ', " ’")
        : dd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      svg.append(tx);
    }

    for (const b of bands) {
      let up = '', dn = '';
      for (let i = 0; i < N; i++) if (b.hi[i] !== null) up += `${up ? 'L' : 'M'}${X(i)},${Y(b.hi[i])}`;
      for (let i = N - 1; i >= 0; i--) if (b.lo[i] !== null) dn += `L${X(i)},${Y(b.lo[i])}`;
      if (up) svg.append(svgEl('path', { d: up + dn + 'Z', fill: 'var(--band)', stroke: 'none' }));
      for (const side of ['lo', 'hi']) {
        let p = '';
        for (let i = 0; i < N; i++) if (b[side][i] !== null) p += `${p ? 'L' : 'M'}${X(i)},${Y(b[side][i])}`;
        svg.append(svgEl('path', {
          d: p, fill: 'none', stroke: 'var(--band-edge)', 'stroke-width': 1.25,
          'stroke-dasharray': '5 4', 'stroke-linejoin': 'round',
        }));
      }
    }

    const endLabels = [];
    for (const s of drawn) {
      const YS = scaleFor(s);
      let p = '', open = false;
      s.pts.forEach((v, i) => {
        if (v === null) { open = false; return; }
        p += `${open ? 'L' : 'M'}${X(i)},${YS(v)}`; open = true;
      });
      svg.append(svgEl('path', {
        d: p, fill: 'none', stroke: s.color, 'stroke-width': (s.width || 2) * (EX ? 1.7 : 1),
        'stroke-dasharray': s.dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));
      const li = s.pts.map((v, i) => v === null ? -1 : i).filter(i => i >= 0).pop();
      if (li !== undefined && li >= 0) {
        endLabels.push({
          x: X(li) + 7, y: YS(s.pts[li]), color: s.color, onY2: s.axis === 'y2',
          text: opts.fmtEnd ? opts.fmtEnd(s.pts[li]) : pct(s.pts[li] - 100, 0),
        });
      }
    }

    // Declutter the endpoint labels: nudge apart anything closer than a line-height,
    // keeping the original vertical ordering, then clamp back inside the plot.
    endLabels.sort((a, b) => a.y - b.y);
    const GAP = EX ? 20 : 13;
    for (let i = 1; i < endLabels.length; i++)
      if (endLabels[i].y - endLabels[i - 1].y < GAP) endLabels[i].y = endLabels[i - 1].y + GAP;
    const overflow = endLabels.length ? endLabels[endLabels.length - 1].y - (M.t + ph) : 0;
    if (overflow > 0) for (const l of endLabels) l.y -= overflow;
    for (const l of endLabels) {
      const t = svgEl('text', {
        x: l.x + (EX ? 5 : 0), y: Math.max(M.t + 4, l.y) + (EX ? 6 : 4), fill: l.color,
        'font-size': EX ? 19 : 11.5, 'font-family': 'var(--mono)', 'font-weight': 700,
        opacity: l.onY2 ? 0 : 1,   // the right-hand axis already labels that scale
      });
      t.textContent = l.text;
      svg.append(t);
    }

    if (EX) { host.querySelector('svg')?.remove(); host.append(svg); return; }
    const cross = svgEl('line', {
      y1: M.t, y2: M.t + ph, stroke: 'var(--ink-3)', 'stroke-width': 1, opacity: 0,
      'shape-rendering': 'crispEdges',
    });
    svg.append(cross);
    const dots = drawn.map(s => {
      const g = svgEl('circle', { r: 4, fill: s.color, stroke: 'var(--bg)', 'stroke-width': 2, opacity: 0 });
      svg.append(g); return g;
    });
    const hit = svgEl('rect', { x: M.l, y: M.t, width: pw, height: ph, fill: 'transparent' });
    svg.append(hit);

    function move(ev) {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * W;
      let i = Math.round((px - M.l) / pw * (N - 1));
      i = Math.max(0, Math.min(N - 1, i));
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
      const rows = [];
      drawn.forEach((s, k) => {
        const v = s.pts[i];
        if (v === null || v === undefined) { dots[k].setAttribute('opacity', 0); return; }
        dots[k].setAttribute('cx', X(i)); dots[k].setAttribute('cy', scaleFor(s)(v)); dots[k].setAttribute('opacity', 1);
        const f = s.axis === 'y2' ? (opts.fmtTip2 || opts.fmtTip) : opts.fmtTip;
        rows.push(`<div class="r"><span class="nm"><i class="sw" style="background:${s.color}"></i>${s.label}</span>
          <span class="vv">${f ? f(v) : pct(v - 100, 1)}</span></div>`);
      });
      tip.innerHTML = `<div class="d">${dateLabel(dates[i])}</div>` + rows.join('');
      tip.style.opacity = 1;
      const hostR = host.getBoundingClientRect();
      const lx = (X(i) / W) * hostR.width;
      tip.style.left = Math.min(Math.max(lx + 14, 4), hostR.width - tip.offsetWidth - 4) + 'px';
      tip.style.top = Math.max(4, (ev.clientY - hostR.top) - tip.offsetHeight - 14) + 'px';
    }
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchmove', e => { move(e.touches[0]); e.preventDefault(); }, { passive: false });
    const hide = () => {
      cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); tip.style.opacity = 0;
    };
    hit.addEventListener('mouseleave', hide);
    hit.addEventListener('touchend', hide);

    host.querySelector('svg')?.remove();
    host.append(svg);
  }

  return api;
}
function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(Math.abs(x) || 1)));
  const f = x / e;
  return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * e;
}

function segGroup(items, cur, onPick) {
  const g = el('div', { class: 'grp' });
  const btns = items.map(([val, label]) => {
    const b = el('button', { class: 'seg', type: 'button', 'aria-pressed': String(val === cur) }, label);
    b.addEventListener('click', () => {
      btns.forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      onPick(val);
    });
    g.append(b); return b;
  });
  return g;
}

/* Preset ranges plus a free start date. The two are mutually exclusive: picking a
   preset clears the date, and picking a date deselects the presets. */
function rangeControls(chart, dates) {
  const grp = el('div', { class: 'grp' });
  let dateInput;
  const btns = RANGES.map(([val, label]) => {
    const b = el('button', { class: 'seg', type: 'button', 'aria-pressed': String(val === chart.state.range) }, label);
    b.addEventListener('click', () => {
      btns.forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      dateInput.value = '';
      chart.state.range = val;
      chart.state.from = null;
      chart.draw();
    });
    grp.append(b);
    return b;
  });

  dateInput = el('input', {
    type: 'date', class: 'dateinp', min: dates[0], max: dates[dates.length - 1],
    'aria-label': 'Start the chart from a specific date',
  });
  dateInput.addEventListener('change', () => {
    btns.forEach(x => x.setAttribute('aria-pressed', 'false'));
    if (dateInput.value) {
      chart.state.range = 'custom';
      chart.state.from = dateInput.value;
    } else {
      chart.state.range = 'max';
      chart.state.from = null;
      btns[btns.length - 1].setAttribute('aria-pressed', 'true');
    }
    chart.draw();
  });

  return el('div', { class: 'ctrls' }, [
    grp,
    el('label', { class: 'datectl' }, [el('span', {}, 'From'), dateInput]),
  ]);
}

  ytd: 'year to date', '1y': 'past year', max: 'since the first SOL purchase' };

/* One "⤓ PNG" control per chart, matching the pattern on stateofsol.com. */
function dlRow(chart, title, filenameSlug, sources) {
  const b = el('button', { class: 'dlbtn', type: 'button', title: 'Download this chart as a PNG' }, '⤓ PNG');
  b.addEventListener('click', () => {
    if (!chart.host.querySelector('svg')) return;
    const st = chart.state;
    const window = st.range === 'custom' ? `from ${dateLabel(st.from)}` : RANGE_NAME[st.range] || '';
    const dates = chart.lastDates || [];
    const span = dates.length ? `${dateLabel(dates[0])} – ${dateLabel(dates[dates.length - 1])}` : '';
    exportPNG(chart, {
      title,
      subtitle: [window, st.log ? 'log scale' : 'linear scale', span].filter(Boolean).join(' · '),
      legend: (chart.lastDrawn || []).map(x => ({
        label: x.label,
        color: getComputedStyle(document.documentElement).getPropertyValue(x.color.replace(/var\(|\)/g, '')).trim() || x.color,
        dash: x.dash, width: x.width,
        value: chart.endValue ? chart.endValue(x) : null,
      })),
      footer: sources,
      filename: `state-of-dfdv-${filenameSlug}-${(dates[dates.length - 1] || '').replace(/-/g, '')}.png`,
    });
  });
  return el('div', { class: 'dlrow' }, b);
}

function legendFor(chart, series) {
  const box = el('div', { class: 'legend' });
  for (const s of series) {
    const it = el('div', { class: 'it', role: 'button', tabindex: '0', 'aria-pressed': 'true' });
    const sw = svgEl('svg', { width: 22, height: 10 });
    sw.append(svgEl('line', {
      x1: 0, x2: 22, y1: 5, y2: 5, stroke: s.color, 'stroke-width': s.width || 2,
      'stroke-dasharray': s.dash || null, 'stroke-linecap': 'round',
    }));
    it.append(sw, el('span', {}, s.label));
    const toggle = () => {
      const on = it.getAttribute('aria-pressed') === 'true';
      it.setAttribute('aria-pressed', String(!on));
      if (on) chart.state.off.add(s.key); else chart.state.off.delete(s.key);
      chart.draw();
    };
    it.addEventListener('click', toggle);
    it.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    box.append(it);
  }
  return box;
}

/* The marquee runs one track translated to -50%, so the item list has to appear
   twice for the loop to be seamless. Duration scales with content length, which is
   what keeps the scroll speed constant however many posts come back. */
function renderMarquee(posts) {
  if (!posts || !posts.length) return;
  const track = $('#marqueeTrack');
  const item = p => {
    const span = el('span', { class: 'mq-item' }, [
      el('span', { class: 'mq-src' }, 'DFDV Newsletter'),
      el('a', { href: p.url, target: '_blank', rel: 'noopener noreferrer' }, p.title),
    ]);
    if (p.date) span.append(el('span', { class: 'mq-date' }, dateLabel(p.date)));
    return span;
  };
  const once = posts.map(item);
  track.replaceChildren(...once, ...posts.map(item));
  const chars = posts.reduce((n, p) => n + (p.title || '').length + 26, 0);
  track.style.setProperty('--dur', Math.max(45, Math.round(chars / 8.2)) + 's');
  $('#marquee').hidden = false;
}

<h4>Where the data comes from</h4>
<ul>
  <li><b>DFDV treasury, share count, debt, options, dfdvSOL</b> — DFDV's own public metrics API at
      <code>defidevcorp.com/api/dashboard/*</code>, the same feed behind dfdv.com.</li>
  <li><b>DFDV, BSOL and SLON prices, volume, short interest, 13F holders</b> — Nasdaq.</li>
  <li><b>SOL perpetual funding</b> — realised hourly funding on Hyperliquid.</li>
  <li><b>Public float and insider ownership</b> — stockanalysis.com.</li>
</ul>

<h4>Pricing the comparison</h4>
<p>SOL is priced at <b>${M.sol_price_basis}</b>, so every series on the performance chart is sampled at the
same instant the equity market closes. This matters more than it sounds: DFDV's own API publishes one SOL price
per day on a UTC clock, and regressing a plain 1× spot SOL ETF against that series returned a beta of 0.26 and
a correlation of 0.23 — impossible for a fund that simply holds the asset, and a sign the two series were about
a day apart. Every return comparison and beta on this page previously inherited that error. On the aligned
series BSOL now regresses at <b>${D.beta_stats.bsol_check === null ? 'n/a' : nf(D.beta_stats.bsol_check, 2) + '×'}</b>
to SOL, which is the check that the clocks agree.</p>
<p>BSOL and SLON are <i>traded prices</i>. An ETF's market price is already net of its expense ratio, which
accrues daily against NAV, so no fee is subtracted from either line — SLON's <b>${nf(M.slon_expense_ratio_pct, 2)}%</b>
expense ratio is inside its path, and deducting it again would double-count. Only the synthetic SOL ETF has fees
applied explicitly, because it is a model rather than a fund.</p>

<h4>Return windows</h4>
<p>Calendar-day windows off the DFDV close, taking the last trading day at or before each anchor.
"Since treasury strategy" runs from the <b>${dateLabel(M.inception)}</b> close of $0.5714 — the day the board
adopted the policy. DFDV's own dashboard uses the same base, so the two agree.</p>

<h4>Levered SOL exposure</h4>
<p><code>SOL NAV ÷ market cap</code> — the dollars of SOL working behind each dollar of DFDV equity, and the
the inverse of what the market pays per dollar of that SOL. It is currently <b>${nf(h.leverage, 2)}×</b>. Note this differs from the
<code>total debt ÷ market cap</code> definition in <i>The SOL Boost</i>, which is
<b>${nf(h.debt_to_mktcap, 2)}×</b>; the first is exposure, the second is borrowing.</p>

<h4>The leverage band</h4>
<p>Each edge compounds a constant multiple of the daily SOL return, at the 25th and 75th percentile of the
levered SOL exposure DFDV has actually run since ${dateLabel(M.treasury_start)} — <b>${nf(B.lo, 2)}×</b> and
<b>${nf(B.hi, 2)}×</b>. The dashed centre line uses the median, <b>${nf(B.mid, 2)}×</b>. DFDV currently sits
<b>${nf((D.band_position ?? 0) * 100, 0)}%</b> of the way across it.</p>
<p>The edges cross, which is not a drawing error: a higher multiple ends <i>lower</i> once SOL falls and
recovers, because compounding a levered exposure through volatility decays it. That is the same effect visible
in SLON on the performance chart, and it is why the band is wide even though SOL is close to flat over the
period.</p>
<p>There is deliberately no SOL-per-share term. Adding one would double-count: the exposure multiple is
<code>SOL NAV ÷ market cap</code>, which already rises when debt or issuance buys more SOL, so crediting SPS
growth on top counts the same SOL twice. An earlier version of this page made exactly that mistake. The cost of
leaving it out is that this is a <i>leverage benchmark, not a fair value</i> — DFDV sitting above the band can
reflect treasury growth rather than richness.</p>

<h4>Beta to SOL</h4>
<p>The OLS slope of DFDV's daily returns regressed on SOL's, over the trailing 30 trading days and over the
whole period. It is the realised counterpart to the balance-sheet exposure figure, and the two disagree
sharply: <b>${D.beta_stats.d30 === null ? 'n/a' : nf(D.beta_stats.d30, 2) + '×'}</b> over 30 days,
<b>${D.beta_stats.d90 === null ? 'n/a' : nf(D.beta_stats.d90, 2) + '×'}</b> over 90 days and
<b>${D.beta_stats.all === null ? 'n/a' : nf(D.beta_stats.all, 2) + '×'}</b> since the first purchase, against
<b>${nf(h.leverage, 2)}×</b> of SOL carried per dollar of market value. Balance-sheet leverage is what DFDV
holds; beta is what the market has actually paid it.</p>

<h4>A caution on "leverage"</h4>
<p>Two different numbers travel under that word here, and neither is a price multiplier on its own.
<code>SOL NAV ÷ market cap</code> (<b>${nf(h.leverage, 2)}×</b>) is SOL exposure per dollar of market value.
<code>SOL NAV ÷ (SOL NAV − net debt)</code> (<b>${nf(h.sol_nav / (h.sol_nav - h.net_debt), 2)}×</b>) is the
gearing on book equity. Which one moves the share price depends on how the market values the treasury, which is
why the band spans a range of multiples rather than asserting one, and why the realised beta is reported
alongside it.</p>

<h4>The synthetic SOL ETF</h4>
<p>SOL spot compounded with the staking yield implied by the dfdvSOL exchange rate over the trailing 90 days
(<b>${nf(M.staking_apy_pct, 2)}%</b> annualised), less a <b>${nf(M.etf_mgmt_fee_pct, 2)}%</b> sponsor fee and a
<b>${nf(M.etf_staking_fee_pct, 0)}%</b> manager cut of staking rewards — BSOL's published post-waiver schedule.
It runs across the whole window because no spot SOL ETF existed before ${dateLabel(M.bsol_inception)}. Actual
BSOL is spliced in from launch at the synthetic line's level that day; the two have stayed within about a
point of each other, which is the check that the model is behaving.</p>

<h4>The theoretical perp</h4>
<p>A 1× long SOL perpetual, rebalanced daily to constant notional, paying the realised Hyperliquid funding
rate each day (the sum of that day's hourly prints), less a one-off <b>${nf(M.perp_taker_fee_bps, 1)}bp</b>
taker fee at entry. No liquidation modelling — at 1× there is nothing to liquidate.</p>

<h4>Short interest</h4>
<p>FINRA semi-monthly settlements via Nasdaq. Days to cover is Nasdaq's, using the average daily volume at
each settlement. Only the current float is published, so the historical % of float holds the insider-held
fraction constant and lets float track the share count — the level is exact today and approximate earlier.</p>

<h4>Known limitations</h4>
<ul>
  <li>13F holdings lag by up to a quarter and cover institutions only.</li>
  <li>SLON is a 2× <i>daily</i> reset product listed ${dateLabel(M.slon_inception)}; it is spliced onto SOL
      spot at listing, and its path reflects daily compounding, not 2× the period return.</li>
  <li>The synthetic ETF assumes fully-staked assets and no tracking error or premium/discount to NAV.</li>
  <li>Treasury holdings step on announcement dates, not settlement dates.</li>
  <li>Rebasing means every percentage on the charts is relative to the start of the window you have selected.</li>
</ul>
` }),
    ]),
  ]));

            el('div', { class: 'sub' }, 'Latest: ' + Object.entries(F.latest_by_form)
              .map(([k, v]) => `${k} ${dateLabel(v.date)}`).join(' · ')),

        ]),

    ]));
  }

  $('#foot').innerHTML =
    `<p><b>Not investment advice.</b> This page is an independently assembled view of public data about
     DeFi Development Corp (Nasdaq: DFDV). It is for information only, is not an offer to buy or sell any
     security, and is not a recommendation. Figures are drawn from third-party sources believed reliable but

     <p style="margin-top:11px">Generated ${new Date(D.generated_at).toUTCString()} ·
     Sources: <a href="https://defidevcorp.com">defidevcorp.com</a>, Nasdaq, Hyperliquid, stockanalysis.com ·
     Leverage framework: <a href="https://defidevcorp.beehiiv.com/p/the-sol-boost">The SOL Boost</a></p>`;

  // Draw synchronously: requestAnimationFrame never fires in a backgrounded tab,
  // which would leave the charts blank for anyone opening the page in a new tab.

}
